# PRODUCTION stack — talks to EXTERNAL AWS RDS (Postgres) and S3 (files), same
# architecture as docker-compose.dev.yml (see docs/DEPLOYMENT.md /
# docs/AWS_SETUP.md). No local Postgres and no local file-storage volume: RDS
# holds all data, S3 holds all files. The ONLY local stateful piece is Redis
# (Celery broker + cache + rate-limit windows) — a small appendonly volume so
# queued background jobs survive a restart.
#
# Resource limits below are sized for a 4-vCPU / 16GB box (e.g. m6i.xlarge) —
# NOT dev.yml's 2-vCPU numbers anymore. Reasoning per service, since it's not
# an even split:
#   worker  — highest headroom on purpose. Each Celery task can shell out to
#             LibreOffice (headless `soffice`) to render DOCX/XLSX to page
#             images for extraction/preview, and LibreOffice alone commonly
#             uses several hundred MB per conversion. With
#             CELERY_CONCURRENCY=4, up to 4 of those can run at once —
#             underestimating this is exactly what OOM-kills a worker mid
#             month-end burst.
#   backend — async I/O-bound (FastAPI + SQLAlchemy), not memory-hungry per
#             worker process, but UVICORN_WORKERS=4 means 4 separate
#             processes, so still needs real headroom, just less than worker.
#   redis   — broker + cache + rate-limit windows for a few hundred
#             employees, not millions of keys — genuinely light.
#   frontend/nginx — static-file serving / reverse proxy only, no per-request
#             processing — trivial either way.
# If you resize the box again, UVICORN_WORKERS/CELERY_CONCURRENCY in .env are
# still the primary lever (roughly: workers = vCPUs) — just make sure these
# limits scale with them, or more workers just means more OOM risk instead
# of more throughput.
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# or: bash scripts/prod/start.sh        (see commands/prod.txt for all commands)
#
# Required in .env:
#   DATABASE_URL      postgresql+asyncpg://USER:PASS@<rds-endpoint>:5432/timesheet?ssl=require
#   STORAGE_PROVIDER  s3
#   S3_BUCKET/S3_REGION   your bucket
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY   blank if using an EC2 IAM role;
#     set them only when the box has no role (e.g. a static access key).

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  backend:
    build: { context: ./backend }
    # Apply Alembic migrations against the RDS in DATABASE_URL, THEN serve.
    # bootstrap_migrations.py = `alembic upgrade head`, but first stamps the
    # baseline if the DB predates Alembic (tables exist, no alembic_version) so
    # it never fails with DuplicateTable. Safe to run on every boot (idempotent).
    # Workers are tunable from .env (UVICORN_WORKERS) without editing this file.
    command: sh -c "python bootstrap_migrations.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-4}"
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      AUTO_CREATE_TABLES: "false"        # Alembic (against RDS) owns the schema
      # DATABASE_URL / STORAGE_PROVIDER / S3_* come from .env only
    expose: ["8000"]
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "2.50", memory: 4096M }

  worker:
    build: { context: ./backend }
    # -B = embedded beat scheduler (pipeline-raw purge on
    # PIPELINE_RAW_PURGE_INTERVAL_HOURS from .env). Keep this a SINGLE replica
    # — beat must not run twice.
    command: celery -A app.core.celery_app.celery_app worker -B --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4}
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      AUTO_CREATE_TABLES: "false"
      DB_NULLPOOL: "true"
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
      backend: { condition: service_healthy }   # wait for migrations to finish
    deploy:
      resources:
        limits: { cpus: "1.50", memory: 4096M }

  frontend:
    build: { context: ./frontend, target: prod }
    volumes:
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    expose: ["80"]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }

  # Public gateway: SPA → frontend, API → backend. Bound directly on :80 so
  # http://<ec2-public-ip>/ works with no extra setup — this box has no
  # host-level nginx/certbot/domain in front. If you later add a domain +
  # TLS (docs/DEPLOYMENT.md §7, nginx/host-tls.conf.example), switch this to
  # "127.0.0.1:8080:80" instead so the host nginx can own 80/443.
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on: [frontend, backend]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }

volumes:
  redis_data:
