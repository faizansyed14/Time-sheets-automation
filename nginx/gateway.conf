# Gateway container — public entrypoint. Proxies SPA → frontend, API → backend.
# Mounted into the `nginx` service (plain nginx image).

client_max_body_size 100m;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain text/css application/javascript application/json
    application/xml image/svg+xml font/woff2;

# Docker's internal DNS, re-checked every 10 s. Without it nginx resolved "backend" and
# "frontend" ONCE at start; when a deploy recreated those containers (new IPs) while this
# one kept running, every request failed with 502 until nginx was restarted by hand.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    server_tokens off;

    # In prod the host nginx (TLS) sits in front of this one and passes the visitor's IP in
    # X-Real-IP. Without these lines every visitor looked like the host proxy's address, so
    # the per-IP sign-in limits were shared by the whole company. Only the Docker network
    # and localhost are trusted (this port is published on 127.0.0.1 only), and the host
    # nginx overwrites any X-Real-IP a client sends.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    location ~ ^/(api|auth|health) {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
